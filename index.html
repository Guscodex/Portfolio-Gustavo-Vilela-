      :root {

      .header-scrolled {
        background-color: var(--header-bg-scrolled);

      /* Background Patterns for Clean Design */
      .bg-grid-pattern {

      }

      .bg-noise {
        position: relative;
      }
      
      .bg-noise::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 0;
      }

      /* Accessibility Focus Styles */
      *:focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 4px;
      }

      /* High Contrast Mode Styles */
      html.high-contrast {
        filter: contrast(130%);
      }
      
      html.high-contrast body {
        background-color: #000000 !important;
        color: #FFFF00 !important;
      }

      html.high-contrast *:not([data-no-contrast] *):not([vw] *) {
        background-color: #000000 !important;
        color: #FFFF00 !important;
        border-color: #FFFF00 !important;
        box-shadow: none !important;
        text-shadow: none !important;
      }

      html.high-contrast a:not([data-no-contrast] *):not([vw] *), 
      html.high-contrast button:not([data-no-contrast] *):not([vw] *) {
        color: #00FFFF !important;
        text-decoration: underline;
        border: 2px solid #00FFFF !important;
      }
      
      html.high-contrast a:hover:not([data-no-contrast] *):not([vw] *),
      html.high-contrast button:hover:not([data-no-contrast] *):not([vw] *) {
        background-color: #00FFFF !important;
        color: #000000 !important;
      }

      html.high-contrast img:not([vw] *), 
      html.high-contrast video:not([vw] *) {
        filter: grayscale(100%) contrast(150%);
        opacity: 0.8;
      }

      html.high-contrast svg:not([vw] *) {
         stroke: #FFFF00 !important;
         fill: #FFFF00 !important;
      }
      
      html.high-contrast [vw], html.high-contrast [vw] * {
         background-color: transparent !important;
         filter: none !important;
         border-color: transparent !important;
      }
    </style>
